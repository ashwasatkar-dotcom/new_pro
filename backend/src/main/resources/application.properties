# Server Configuration
server.port=8080
server.servlet.context-path=

# Active Profile:
# Set to 'h2' for instant embedded database (no external SQL Server setup required).
# To switch to Microsoft SQL Server: enable TCP/IP in SQL Server and set spring.profiles.active=mssql
spring.profiles.active=h2

# JWT Security Configuration
app.jwt.secret=9a3f4e8b2c1d0f5e7a9b8c6d4e2f0a1b3c5d7e9f1a2b4c6d8e0f2a4b6c8d0e2f
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.yourorg.appname=DEBUG
